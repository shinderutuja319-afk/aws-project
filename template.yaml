AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Serverless AI Resume Analyzer

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256

  # CORS for the implicit HTTP API (logical ID: ServerlessHttpApi)
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - "*"
      AllowHeaders:
        - Content-Type
      AllowMethods:
        - POST
        - OPTIONS

Resources:

  # =========================
  # S3 BUCKET
  # =========================
  # Explicit name so ProcessorFunction's policy can build the ARN from the
  # name instead of referencing this resource (avoids the circular dependency).
  # Name = <stack-name>-uploads-<account-id>-<region>  (stack name must be lowercase)
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}"

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      # Needed only if a browser uploads straight to the presigned URL
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
            MaxAge: 3000

      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-resumes
            Status: Enabled
            ExpirationInDays: 1

  # =========================
  # DYNAMODB
  # =========================
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S

      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # =========================
  # UPLOAD URL LAMBDA
  # =========================
  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/upload_url/
      Handler: app.lambda_handler

      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucket

      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadsBucket

      Events:
        UploadUrlApi:
          Type: HttpApi
          Properties:
            Path: /upload-url
            Method: POST

  # =========================
  # PROCESSOR LAMBDA
  # =========================
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/processor/
      Handler: app.lambda_handler

      Timeout: 30
      MemorySize: 512

      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          MODEL_ID: amazon.nova-lite-v1:0

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              # Built from the bucket NAME (not !Ref / !GetAtt) to avoid the circular dependency
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}/resumes/*"

            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ResultsTable.Arn

            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"

      Events:
        S3UploadEvent:
          Type: S3
          Properties:
            Bucket: !Ref UploadsBucket
            Events: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: resumes/

# =========================
# OUTPUTS
# =========================
Outputs:

  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  BucketName:
    Description: Resume upload S3 bucket
    Value: !Ref UploadsBucket

  ResultsTableName:
    Description: DynamoDB results table
    Value: !Ref ResultsTable